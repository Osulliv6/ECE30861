openapi: 3.1.1
info:
  title: ECE 30861 ADA Tester Interface
  version: 1.0.0
  description: >
    Runs this team's suite (T-01 to T-13) against any target system's project API
    (/health, /formats, /analyze) and returns one report with results and coverage.
servers:
  - url: https://ece30861-ada.onrender.com/tester
paths:
  /test/setup:
    post:
      summary: Create a session and wait for system setup to succeed
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [target_url]
              properties:
                target_url: {type: string, format: uri}
      responses:
        '201':
          description: System ready; same session ID returned by tester and system
          content:
            application/json:
              schema:
                type: object
                required: [session_id]
                properties:
                  session_id: {type: string, minLength: 1}
        default:
          description: Setup failed; a system setup error is forwarded with its status, message, and source
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorBody'}
  /test/run:
    post:
      summary: Run the tester sequence and return the complete report
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [session_id]
              properties:
                session_id: {type: string, minLength: 1}
      responses:
        '200':
          description: Complete tester suite report with results and coverage
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SuiteReport'}
        '400': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
        '500': {$ref: '#/components/responses/Error'}
  /test/report:
    get:
      summary: Retrieve the stored report without running tests
      parameters:
        - name: session_id
          in: query
          required: true
          schema: {type: string, minLength: 1}
      responses:
        '200':
          description: Stored tester suite report with results and coverage
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SuiteReport'}
        '400': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '409':
          description: Execution has not ended; retry the lookup later
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorBody'}
components:
  schemas:
    ErrorBody:
      type: object
      required: [message, source]
      properties:
        message: {type: string, minLength: 1}
        source: {type: string, enum: [tester, system, communication, unknown]}
    CoverageMeasure:
      type: object
      required: [covered, total, basis]
      properties:
        covered: {type: ['integer', 'null'], minimum: 0}
        total: {type: ['integer', 'null'], minimum: 0}
        basis: {type: string, minLength: 1}
    SuiteReport:
      type: object
      required: [session_id, target_url, results, coverage]
      properties:
        session_id: {type: string, minLength: 1}
        target_url: {type: string}
        results:
          type: array
          items:
            type: object
            required: [test_id, outcome, message]
            properties:
              test_id: {type: string, minLength: 1}
              outcome: {type: string, enum: [pass, fail, error, skip]}
              message: {type: string, minLength: 1}
              source: {type: string, enum: [tester, system, communication, unknown]}
        coverage:
          type: object
          required: [code, component, system]
          properties:
            code: {$ref: '#/components/schemas/CoverageMeasure'}
            component: {$ref: '#/components/schemas/CoverageMeasure'}
            system: {$ref: '#/components/schemas/CoverageMeasure'}
  responses:
    Error:
      description: Testing interface error
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ErrorBody'}
